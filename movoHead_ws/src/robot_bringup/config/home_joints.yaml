# Custom home joint angles (degrees) for MOVO arms.
# After Kinova native home completes, the ArmJointAngles action moves the arm
# to these angles. The driver's sendAdvanceTrajectory() with speed-limited
# angular control handles smooth trajectory planning on the robot DSP.
# Runtime code remaps each target to the nearest equivalent revolution
# relative to current joint state (same pose, safer branch selection).

right_arm:
  joint1: 266.39
  joint2: 82.92
  joint3: 190.84
  joint4: 310.59
  joint5: 190.75
  joint6: 180.69
  joint7: 180.00

# MIRRORED 360 - right_arm
left_arm:
  joint1: 94.61
  joint2: 277.08
  joint3: 169.16
  joint4: 49.41
  joint5: 169.25
  joint6: 179.31
  joint7: 180.00
