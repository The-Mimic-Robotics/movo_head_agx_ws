---
################################################################################
# Nav2 Simulation Configuration File
################################################################################
# -------------------------------
# Map Server - 
# -------------------------------
map_server:
  ros__parameters:
    use_sim_time: False    
    yaml_filename: "/home/useradmin/movoHead_ws/src/movobase_ctr/my_maps/map_t4.yaml"  # Use absolute path
       # Real robot
    # yaml_filename: "/home/useradmin/movoHead_ws/src/movobase_ctr/my_maps/map1.yaml"  # Your map file "my_map2.yaml""
    topic_name: "map"           # Matches AMCL’s map_topic
    frame_id: "map"             # Standard frame for map
# -------------------------------
# AMCL (Localization) -- ros2 run nav2_amcl amcl --ros-args --params-file /home/movo_base/my_movobase_ws/src/movo_nav/config/dual_lidar_slam_param.yaml
# -------------------------------
amcl:
  ros__parameters:
    use_sim_time: False
    publish_particlecloud: true
    # Motion model noise parameters
    alpha1: 0.1  # Rotation from rotation
    alpha2: 0.1  # Rotation from translation
    alpha3: 0.1  # Translation from translation
    alpha4: 0.1  # Translation from rotation
    alpha5: 0.1  # Strafing (omni-specific)

    # Frame IDs
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # Beam skipping
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    # do_beamskip: True
    do_beamskip: false #if your /scan topic has sparse or noisy data, enabling it (true) can improve performance.

    # Laser model settings
    laser_likelihood_max_dist: 2.0
    laser_max_range: 20.0
    laser_min_range: -1.0 # as per documentation
    laser_model_type: "likelihood_field"
    max_beams: 100
    scan_topic: "scan"

    # Particle filter settings
    max_particles: 2000 
    min_particles: 100  
    # Update thresholds
    update_min_a: 0.05
    update_min_d: 0.05 # used to be 0.2, 0.25
    pf_err: 0.1
    pf_z: 0.95
    resample_interval: 1

    # Recovery behavior
    # recovery_alpha_fast: 0.1
    # recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.01
    recovery_alpha_slow: 0.001

    # Robot model for mecanum wheels
    # robot_model_type: "nav2_amcl::OmniMotionModel"
    robot_model_type: "nav2_amcl::OmniMotionModel"

    # Timing and tolerance
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0

    

    # Laser likelihood weights
    sigma_hit: 0.2
    z_hit: 0.7
    z_max: 0.1
    z_rand: 0.15
    z_short: 0.05

    # Map-related settings
    map_topic: "map"  # Default, change if your map_server uses a different topic
    first_map_only: true  # Set to true since you’re using a fixed map

    # Optional: Set initial pose if known
    set_initial_pose: false
    # initial_pose_x: 0.0  # Set to your robot's starting position
    # initial_pose_y: 0.0  # Set to your robot's starting position
    # initial_pose_a: 0.0  # Set to your robot's starting orientation
    # initial_cov_xx: 0.25
    # initial_cov_yy: 0.25
    # initial_cov_aa: 0.068

    particle_cloud_topic: "/particle_cloud"
    use_pose_array_particle_cloud: true  # Add this to force PoseArray
    qos_overrides:
      /particle_cloud:
        reliability: "best_effort"



# amcl_map_client:
#   ros__parameters:
#     use_sim_time: False

# amcl_rclcpp_node:
#   ros__parameters:
#     use_sim_time: False

# -------------------------------
# Controller Server (Local Planner)
# -------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # DWB Local Planner parameters for the FollowPath plugin
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5  # Increased; adjust per your robot’s spec
      max_vel_y: 0.5  # Enabled for mecanum
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5  # Matches max_vel_x/y
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.5  # Enabled for mecanum
      acc_lim_theta: 3.2
      decel_lim_x: -0.5
      decel_lim_y: -0.5 # Enabled for mecanum
      decel_lim_theta: -0.5
      vx_samples: 20
      vy_samples: 20  # Enabled for mecanum
      vtheta_samples: 40
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# -------------------------------
# Planner Server (Global Planner)
# -------------------------------
# planner_server:
#   ros__parameters:
#     use_sim_time: false
#     # Example using NavFn; adjust tolerance and other parameters as needed.
#     tolerance: 0.5

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

# -------------------------------
# Behavior Tree Navigator
# -------------------------------

# find $(ros2 pkg prefix nav2_bt_navigator)/share/nav2_bt_navigator/behavior_trees -type f -name "*.xml"

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False
# --------------------------
# Recoveries Server
# odometry_calibration
# -------------------------------
recoveries_server:
  ros__parameters:
    use_sim_time: false
    # Recovery-specific parameters can be added here.

# -------------------------------
# Global Costmap Configuration
# -------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.1
      transform_tolerance: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.5
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

# -------------------------------
# Local Costmap Configuration
# -------------------------------

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.1
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 5
      height: 4
      resolution: 0.05
      footprint: "[ [0.5, 0.4], [0.5, -0.4], [-0.5, -0.4], [-0.5, 0.4] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

