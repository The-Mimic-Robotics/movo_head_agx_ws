# homing_pose_name → home_poses.<name> joints + movo_linear_axis_map.<name> per arm
#
# Leader frame (sticks / AXE / UDP): +x = forward, +y = left, +z = up.
# movo_linear_axis_map.<pose>.<arm> is three comma-separated tokens: which leader axis
# feeds Kinova base linear X, Y, Z (optional leading '-'). Parsed by
# arms_xbox_ctr.home_joint_config.apply_linear. Change homing_pose_name to pick the row;
# elbow_up vs elbow_out can use different maps for the same physical stick motion.

homing_pose_name: elbow_out

home_poses:
  # Original / reference pose
  elbow_up:
    right_arm:
      joint1: 268.94
      joint2: 82.92
      joint3: 190.84
      joint4: 322.63
      joint5: 190.75
      joint6: 142.04
      joint7: 180.00
    left_arm:
      joint1: 91.06
      joint2: 277.08
      joint3: 169.16
      joint4: 37.37
      joint5: 169.25
      joint6: 217.96
      joint7: 180.00

  # Joint1 ~90° outward (default home + teleop offset vs elbow_up)
  elbow_out:
    right_arm:
      joint1: 178.94
      joint2: 82.92
      joint3: 190.84
      joint4: 322.63
      joint5: 190.75
      joint6: 142.04
      joint7: 180.00
    left_arm:
      joint1: 181.06
      joint2: 277.08
      joint3: 169.16
      joint4: 37.37
      joint5: 169.25
      joint6: 217.96
      joint7: 180.00

movo_linear_axis_map:
  elbow_up:
    left_arm: x,y,z
    right_arm: x,y,z
  elbow_out:
    # Kinova X←−leader Y, Y←−leader Z, Z←leader X (pose-specific vs raw x,y,z)
    left_arm: "-y,-z,x"
    right_arm: "-y,-z,x"
