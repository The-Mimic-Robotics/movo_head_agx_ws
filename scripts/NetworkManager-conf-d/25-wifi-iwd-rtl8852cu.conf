# Use iwd only for Realtek rtl8852cu USB (6 GHz + WPA3-SAE); NM 1.36 + wpa_supplicant
# often times out on 6 GHz for this chip.
#
# Install: sudo cp ... /etc/NetworkManager/conf.d/25-wifi-iwd-rtl8852cu.conf
#          sudo systemctl restart NetworkManager
[device]
match-device=driver:rtl8852cu
wifi.backend=iwd
